version: 2
method: scrum-with-kanban-and-evidence-gates
cadence:
  sprint_length_days: 14
  ceremonies: [refinement, planning, daily-flow-review, review, retrospective]
flow:
  pull_system: true
  columns: [discovery, ready, design, ready-for-build, implementation, review, validation, documentation, ready-for-release, done]
  wip_limits:
    design: 2
    implementation: 3
    review: 2
    validation: 2
    high_or_critical_risk_total: 1
  required_metrics: [wip, throughput, work-item-age, cycle-time, blocked-time]
work_item:
  root: work/<WORK-ID>
  status_schema: contracts/work-item.schema.json
  handoff_schema: contracts/handoff.schema.json
  memory_delta_schema: contracts/memory-delta.schema.json
  ledger: documentation/delivery-ledger.md
states:
  - id: intake
    owner: delivery-orchestrator
    action: create-work-item-and-classify
    next: discovery
  - id: discovery
    owner: requirements-analyst
    collaborators: [product-owner, ux-ui-designer, skill-curator, brand-strategist, storytelling-strategist, growth-marketing-strategist]
    outputs: [discovery/brief.md, epic.md, stories]
    next: product-ready
  - id: product-ready
    owner: product-owner
    gate: G1-product
    approved_next: design
    feedback_next: discovery
  - id: design
    owner: solution-architect
    collaborators: [ux-ui-designer, data-architect, data-ai-architect, security-reviewer, test-engineer, integration-engineer, swarm-consensus-coordinator]
    outputs: [specs, adr, threat-model, test-plan]
    next: design-ready
  - id: design-ready
    owner: delivery-orchestrator
    gate: G2-design
    approved_next: ready-for-build
    feedback_route: artifact-owner
  - id: ready-for-build
    owner: delivery-orchestrator
    gate: G3-readiness
    approved_next: implementation
    feedback_route: artifact-owner
  - id: implementation
    owner: delivery-orchestrator
    selectable_agents: [software-engineer, frontend-engineer, backend-engineer, integration-engineer, data-engineer, dba-databricks-engineer, ai-engineer, ml-engineer, agent-rag-engineer, mlops-llmops-engineer, platform-engineer, direct-response-copywriter, offensive-cyber-operator]
    outputs: [code, tests, implementation-logs, evidence]
    next: review
  - id: review
    owner: code-reviewer
    collaborators: [security-reviewer, offensive-cyber-operator]
    gate: G4-code-security
    approved_next: validation
    feedback_route: root-cause-owner
  - id: validation
    owner: qa-engineer
    collaborators: [test-engineer, performance-engineer, sre-observability-engineer, mlops-llmops-engineer, ai-analyst]
    gate: G5-quality
    approved_next: documentation
    feedback_route: root-cause-owner
  - id: documentation
    owner: technical-writer
    collaborators: [governance-auditor, storytelling-strategist, brand-strategist]
    outputs: [updated-docs, delivery-ledger, traceability]
    next: ready-for-release
  - id: ready-for-release
    owner: devops-release-engineer
    collaborators: [sre-observability-engineer, governance-auditor]
    gate: G6-governance-release
    approved_next: done
    feedback_route: root-cause-owner
  - id: done
    owner: governance-auditor
    terminal: true
gates:
  G1-product:
    owner: product-owner
    criteria: [problem-clear, product-goal-defined, stories-invest, acceptance-testable, value-prioritized, dependencies-known, bdd-specification-valid]
    human_required: true
  G2-design:
    owner: solution-architect
    independent_reviewers: [security-reviewer, test-engineer]
    criteria: [options-compared, adr-recorded, interfaces-defined, data-contracts-defined-when-applicable, threat-model-done, test-strategy-defined, observability-and-rollback-designed]
    human_required_when: risk-medium-high-critical
  G3-readiness:
    owner: delivery-orchestrator
    criteria: [definition-of-ready, owners-assigned, skills-local-and-resolvable, dependencies-resolved, environments-known, estimates-bounded]
  G4-code-security:
    owners: [code-reviewer, security-reviewer]
    criteria: [spec-conformance, clean-code, component-contract-comments, tests-green, sentry-security-review, gha-review-when-workflows-change, dependencies-and-secrets-checked, tdd-cycle-valid, clean-code-executed, tests-executed, security-executed]
    independent_reviewer_when: risk-medium-high-critical
  G5-quality:
    owner: qa-engineer
    criteria: [acceptance-passed, regression-passed, failure-paths-passed, nonfunctional-passed, tdd-cycle, bdd-scenarios, ai-ml-evaluation-passed-when-applicable, evidence-complete, acceptance-bdd-executed, regression-executed, coverage-executed]
    human_required_when: business-acceptance
  G6-governance-release:
    owners: [governance-auditor, devops-release-engineer]
    criteria: [traceability-complete, documentation-current, delivery-ledger-current, observability-ready, rollout-and-rollback-ready, approvals-current]
    human_required: true
definition_of_ready:
  - user-and-problem-identified
  - acceptance-criteria-testable
  - dependencies-data-classification-and-risk-known
  - required-skills-approved-and-local
  - no-blocking-open-question
definition_of_done:
  - acceptance-criteria-proven
  - required-tests-green
  - security-findings-resolved-or-formally-waived
  - documentation-ledger-and-traceability-updated
  - observability-and-rollback-ready
  - handoffs-and-memory-deltas-valid
  - human-approval-recorded-when-required
boundaries:
  automatic_external_actions: false
  forbidden_without_specific_human_authorization: [deploy, push, cab, credential-change, production-data-change]
