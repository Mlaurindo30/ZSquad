version: 3
method: spec-driven-with-proportional-evidence-gates
cadence:
  sprint_length_days: 14
  ceremonies: [refinement, planning, daily-flow-review, review, retrospective]
flow:
  pull_system: true
  # US-10 (2026-09-02): removido `review-qa` — estado órfão, não usado em cycles.yaml.
  columns: [blueprint, scaffolding, implementation, code-security-review, quality-validation, governance-release, done]
  wip_limits:
    blueprint: 2
    scaffolding: 2
    implementation: 3
    code-security-review: 2
    quality-validation: 2
    governance-release: 1
    high_or_critical_risk_total: 1
  required_metrics: [wip, throughput, work-item-age, cycle-time, blocked-time]
  phase_timeboxes:
    blueprint: 45
    scaffolding: 30
    implementation: 90
    code-security-review: 45
    quality-validation: 60
    governance-release: 30
  halt_condition:
    # cycle = 1 passagem completa do estado `blueprint` ate `done` para o mesmo work item
    # retry = 1 re-execucao do mesmo criterio de gate apos `fail` (gate-decidido rejected/changes_requested)
    max_cycles_per_target: 3
    max_retries_per_check: 2
work_item:
  root: work/<project>/<WORK-ID>
  status_schema: contracts/work-item.schema.json
  handoff_schema: contracts/handoff.schema.json
  memory_delta_schema: contracts/memory-delta.schema.json
  ledger: documentation/delivery-ledger.md
  light_artifact: work/<project>/light/<WORK-ID>.md
states:
  - id: blueprint
    owner: solution-architect
    collaborators: [requirements-analyst, product-owner, ux-researcher, ui-designer, agile-coach, security-reviewer, test-engineer]
    outputs: [blueprint.md, specs, adr, threat-model, test-plan, bdd-spec]
    next: scaffolding
  - id: scaffolding
    owner: delivery-orchestrator
    outputs: [stubs, red-tests, interface-contracts]
    next: implementation
  - id: implementation
    owner: delivery-orchestrator
    selectable_agents: [software-engineer, fullstack-engineer, mobile-engineer, cloud-architect, frontend-engineer, backend-engineer, integration-engineer, data-engineer, dba-databricks-engineer, ai-engineer, ml-engineer, agent-rag-engineer, mlops-llmops-engineer, platform-engineer, direct-response-copywriter, offensive-cyber-operator]
    outputs: [code, tests, implementation-logs, evidence]
    next: code-security-review
  - id: code-security-review
    owner: code-reviewer
    collaborators: [security-reviewer]
    outputs: [reviews, security-evidence]
    next: quality-validation
  - id: quality-validation
    owner: qa-engineer
    collaborators: [test-engineer, performance-engineer, sre-observability-engineer]
    outputs: [validation-evidence, acceptance-results, regression-results]
    next: governance-release
  - id: governance-release
    owner: governance-auditor
    collaborators: [technical-writer]
    outputs: [updated-docs, delivery-ledger, traceability, rollout-rollback-plan]
    next: done
  - id: done
    owner: governance-auditor
    terminal: true
gates:
  GT-entry:
    owners: [product-owner, solution-architect]
    criteria: [blueprint-complete, bdd-specification-valid, adr-recorded, interfaces-defined, data-contracts-defined-when-applicable, threat-model-done, test-strategy-defined]
    human_required_when: risk-medium-high-critical
    deprecated: true
    superseded_by: [G1-product, G2-design]
  G1-product:
    owner: product-owner
    criteria: [blueprint-complete, bdd-specification-valid, data-contracts-defined-when-applicable, timebox-defined, question-stated, finding-documented]
    human_required_when: risk-medium-high-critical
  G2-design:
    owner: solution-architect
    criteria: [adr-recorded, interfaces-defined, threat-model-done, test-strategy-defined, blast-radius-defined, deprecation-strategy-defined, migration-plan-defined]
    human_required_when: risk-medium-high-critical
  GT-design-review:
    owner: delivery-orchestrator
    criteria: [definition-of-ready, tests-red-exist-and-fail, owners-assigned, dependencies-resolved]
    human_required_when: risk-high-critical
  GT-done:
    owners: [code-reviewer, security-reviewer, qa-engineer, governance-auditor]
    criteria: [spec-conformance, tests-green, tdd-cycle-valid, security-executed, acceptance-bdd-executed, regression-executed, coverage-executed, traceability-complete, ledger-current, rollout-rollback-ready]
    human_required_when: risk-medium-high-critical
    deprecated: true
  G4-code-security:
    owner: code-reviewer
    criteria: [spec-conformance, tests-green, tdd-cycle-valid, security-executed]
  G5-quality:
    owner: qa-engineer
    criteria: [acceptance-bdd-executed, regression-executed, coverage-executed]
  G6-governance-release:
    owner: governance-auditor
    criteria: [traceability-complete, ledger-current, rollout-rollback-ready, rollout-plan-defined, rollback-plan-defined, runbook-updated, change-record-created]
    human_required_when: risk-medium-high-critical
# Espelho opcional no board: <project_root>/.agents_squad/config/devops.yaml
# traduz cada estado abaixo (chave) para o estado real do provider (state_map).
gate_state_mapping:
  G1-product: blueprint
  G2-design: blueprint
  GT-design-review: scaffolding
  G4-code-security: quality-validation
  G5-quality: governance-release
  G6-governance-release: done
gate_aliases:
  G3-readiness: GT-design-review
segregation_of_duties:
  enforced_from_risk: medium
  conflicts:
    - [author, reviewer]
    - [author, approver]
    - [reviewer, approver]
    - [executor, approver]
  pairwise_distinct_from_risk: high
legacy_states: [intake, discovery, product-ready, design, design-ready, ready-for-build, documentation, ready-for-release]
definition_of_ready:
  - user-and-problem-identified
  - acceptance-criteria-testable
  - dependencies-data-classification-and-risk-known
  - required-skills-approved-and-local
  - no-blocking-open-question
definition_of_done:
  - acceptance-criteria-proven
  - required-tests-green
  - security-findings-resolved-or-formally-waived
  - documentation-ledger-and-traceability-updated
  - observability-and-rollback-ready
  - human-approval-recorded-when-required
boundaries:
  automatic_external_actions: false
  forbidden_without_specific_human_authorization: [deploy, push, cab, credential-change, production-data-change]
