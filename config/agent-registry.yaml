version: 2
registry:
  owner: delivery-orchestrator
  runtime_adapter: filesystem-portable
  discovery: curated-local-first
  handoff_transport: work-item-files
  memory: private-and-shared
  maximum_active_agents_per_item: 10
agents:
- id: delivery-orchestrator
  path: agents/00-delivery-orchestrator
  title: Swarm & SDLC Delivery Orchestrator
  mode: host
  host_role: provider-primary
  singleton: true
  provider_primary: true
  dispatchable: false
  purpose: SDLC orchestration, WIP control, gate verification, handoff schema enforcement,
    blocker escalation, dependency tracking.
  manifest: agents/00-delivery-orchestrator/skills/manifest.yaml
- id: requirements-analyst
  path: agents/01-requirements-analyst
  title: Requirements & Specification Engineer
  mode: core
  purpose: INVEST user stories, BDD/Gherkin specifications, non-functional requirements
    (NFRs), discovery briefs, edge-case elicitation.
  manifest: agents/01-requirements-analyst/skills/manifest.yaml
- id: product-owner
  path: agents/02-product-owner
  title: Product Value & Discovery Strategist
  mode: core
  purpose: Product Goal definition, value vs risk prioritization, backlog ordering,
    scope negotiation, G1-product gate decisions.
  manifest: agents/02-product-owner/skills/manifest.yaml
- id: scrum-master
  path: agents/03-scrum-master
  title: Flow & Kanban Master
  mode: core
  purpose: WIP limit enforcement, cycle time reduction, blocker removal, cumulative
    flow diagrams (CFD), flow efficiency.
  manifest: agents/03-scrum-master/skills/manifest.yaml
- id: solution-architect
  path: agents/04-solution-architect
  title: Clean Architecture & Systems Pioneer
  mode: core
  purpose: C4 Model architecture, ADRs, interface contracts, fault-isolation, STRIDE
    threat modeling, rollback design, G2-design evaluation.
  manifest: agents/04-solution-architect/skills/manifest.yaml
- id: data-ai-architect
  path: agents/05-data-ai-architect
  title: Lakehouse & AI Systems Architect
  mode: core
  purpose: Medallion Lakehouse architecture, Data Mesh domain contracts, AI pipeline
    topologies, MLflow tracing, LLM safety guardrails.
  manifest: agents/05-data-ai-architect/skills/manifest.yaml
- id: software-engineer
  path: agents/06-software-engineer
  title: Clean Code & TDD Craftsman
  mode: on_demand
  purpose: Red-Green-Refactor TDD, SOLID design principles, clean code contracts,
    component failure handling, unit & integration tests.
  manifest: agents/06-software-engineer/skills/manifest.yaml
- id: data-engineer
  path: agents/07-data-engineer
  title: Idempotent Pipeline & ETL Specialist
  mode: on_demand
  purpose: Idempotent DAGs, dbt transformations, Airflow orchestration, data quality
