version: 1
managed_by: agents-squad
default_cycle: development
# Um ciclo por função do pedido. Novas funções entram como novas entradas aqui,
# sem alterar prompts: o orquestrador identifica a função e segue o ciclo correspondente.
type_to_cycle:
  epic: development
  feature: development
  story: user-story
  task: development
  bug: bugfix
  release: release
  evolution: evolution
  study: spike
  spike: spike
cycles:
  development:
    description: Ciclo completo de entrega de software (Spec-Driven com gates proporcionais).
    entry: blueprint
    source: config/workflow.yaml
    # T5 (Spec Kit): estágio SDD autorizado na SAÍDA de cada estado quando o
    # work item tem pacote SDD e o projeto ativou a política. 'tasking' cobre
    # G1 via cadeia (conclusão de blueprint exige G1+G2); 'implementation'
    # cobre G1+G2+G3 (G3 autoriza implementação).
    sdd_stages:
      blueprint: tasking
      scaffolding: implementation
    states:
      - blueprint         # BDD: especificação nasce aqui
      - scaffolding       # testes RED pré-escritos
      - implementation    # TDD: red-green-refactor, teste falhando primeiro
      - code-security-review
      - quality-validation
      - governance-release
      - done
    practices:
      blueprint:
        - bdd-specification-valid       # GT-entry
      scaffolding:
        - tests-red-exist-and-fail      # GT-design-review
      implementation:
        - tdd-cycle-valid               # GT-done
        - tests-green                   # GT-done
      code-security-review:
        - security-executed             # G4-code-security
        - spec-conformance              # G4-code-security
      quality-validation:
        - acceptance-bdd-executed       # G5-quality
        - regression-executed           # G5-quality
        - coverage-executed             # G5-quality
      governance-release:
        - traceability-complete         # G6-governance-release
        - rollout-rollback-ready        # G6-governance-release
  user-story:
    description: Golden Path completo de User Story (PO -> UX -> Agile Coach -> UI -> Code -> QA).
    entry: blueprint
    source: config/workflow.yaml
    sdd_stages:
      blueprint: tasking
      scaffolding: implementation
    states:
      - blueprint
      - scaffolding
      - implementation
      - code-security-review
      - quality-validation
      - governance-release
      - done
  new-project:
    description: Setup & Architecture para novos projetos.
    entry: blueprint
    source: config/workflow.yaml
    sdd_stages:
      blueprint: tasking
      scaffolding: implementation
    # T5: entra por blueprint, mas o preflight SDD é obrigatório antes de
    # qualquer implementação governada (plano §5) — reforçado no dispatch.
    sdd_preflight: true
    states:
      - blueprint
      - scaffolding
      - done
  bugfix:
    description: Correção expressa de incidente.
    entry: implementation
    source: config/workflow.yaml
    # T5: retomada direta em implementation NÃO contorna o preflight SDD;
    # o dispatch gerenciado (run-engine) exige authorize G1+G2+G3 antes de
    # executar qualquer tarefa (plano §5 e §8 cenário 7).
    sdd_preflight: true
    states:
      - implementation
      - code-security-review
      - quality-validation
      - governance-release
      - done
  spike:
    description: Investigação time-boxed para reduzir incerteza técnica. Sem quality/gov; foco em "achado documentado".
    entry: blueprint
    source: config/workflow.yaml
    timeboxes:
      blueprint: 3d
    states:
      - blueprint
      - done
    practices:
      blueprint:
        - timebox-defined
        - question-stated
        - finding-documented
  release:
    description: Corte de versão e rollout. Foco em change-record, rollout/rollback ready.
    entry: implementation
    source: config/workflow.yaml
    timeboxes:
      implementation: 5d
    states:
      - implementation
      - code-security-review
      - governance-release
      - done
    practices:
      implementation:
        - rollout-plan-defined
        - rollback-plan-defined
        - runbook-updated
      governance-release:
        - change-record-created
  evolution:
    description: Mudança de longo prazo (deprecation, migration, breaking change). ADR + blast radius + deprecation strategy obrigatórios.
    entry: blueprint
    source: config/workflow.yaml
    sdd_stages:
      blueprint: tasking
      scaffolding: implementation
    states:
      - blueprint
      - scaffolding
      - implementation
      - code-security-review
      - quality-validation
      - governance-release
      - done
    practices:
      blueprint:
        - adr-recorded
        - blast-radius-defined
        - deprecation-strategy-defined
        - migration-plan-defined
  incident:
    description: SRE incident (runbook, comms, blameless postmortem). Sem quality formal; postmortem obrigatório.
    entry: triage
    gate_bypass: true  # Incident triage/mitigation/postmortem bypass G1-G6 gates; practices are SRE-specific, not gate criteria
    source: config/workflow.yaml
    states:
      - triage
      - mitigation
      - postmortem
      - done
    timeboxes:
      triage: 15m
      mitigation: 4h
      postmortem: 5d
    practices:
      triage:
        - severity-classified
        - comms-published
        - on-call-paged
      mitigation:
        - runbook-followed
        - service-restored-or-degraded-acceptable
      postmortem:
        - blameless-postmortem-recorded
        - action-items-tracked
