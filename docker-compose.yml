version: '3.8'

services:
  squad-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents_squad_core
    restart: unless-stopped
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: 2.0
    volumes:
      - ./banco:/app/banco
      - ./integrations:/app/integrations
      - ./scripts:/app/scripts
      - ./work:/app/work
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - SQUAD_DB_PATH=/app/banco/squad.db
    ports:
      - "8080:8080"
    depends_on:
      - graph-memory
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; conn = sqlite3.connect('/app/banco/squad.db'); conn.execute('SELECT 1'); conn.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  graph-memory:
    image: falkordb/falkordb:latest
    container_name: agents_squad_graph
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    ports:
      - "6380:6379"
    volumes:
      - squad_graph_data:/data

volumes:
  squad_graph_data:
    driver: local
