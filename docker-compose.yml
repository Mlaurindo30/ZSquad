services:
  squad-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents_squad_core
    restart: unless-stopped
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: 2.0
    command:
      - python
      - -c
      - |
        import signal, sys, time
        signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
        print("Squad runtime standby ready.", flush=True)
        while True:
            time.sleep(1)
    volumes:
      - ./banco:/app/banco
      - ./integrations:/app/integrations
      - ./scripts:/app/scripts
      - ./work:/app/work
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - SQUAD_RUNTIME=/app
      - SQUAD_DB_PATH=/app/banco/squad.db
      - FALKORDB_HOST=graph-memory
      - FALKORDB_PORT=6379
    depends_on:
      - graph-memory
    healthcheck:
      test: ["CMD", "python", "scripts/agent_squad.py", "audit"]
      interval: 30s
      timeout: 15s
      retries: 3

  graph-memory:
    image: falkordb/falkordb:latest
    container_name: agents_squad_graph
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    ports:
      - "6380:6379"
    volumes:
      - squad_graph_data:/data

volumes:
  squad_graph_data:
    driver: local
