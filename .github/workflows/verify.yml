name: Squad Verification CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip check

      - name: Validate squad structure
        run: python scripts/validate_structure.py

      - name: Audit agent squad
        run: python scripts/agent_squad.py audit

      - name: Verify first-party clean code
        run: python scripts/verify_clean_code.py scripts/*.py integrations/*.py

      - name: Run tests with full first-party branch coverage
        run: python -m pytest scripts/tests/ --ignore=scripts/tests/test_quality_gates_bdd.py --cov --cov-report=term-missing

      - name: Run P0 contract integrity acceptance
        run: python -m pytest scripts/tests/test_contract_integrity_p0.py scripts/tests/test_work_cycles.py -q

      - name: Run pip-audit
        run: pip install pip-audit && pip-audit

      - name: Run bandit
        run: pip install bandit && bandit -r scripts/ integrations/

      - name: Run semgrep
        run: pip install semgrep && semgrep --config=auto scripts/ integrations/

      - name: Verify neuroinclusive prompt contracts
        run: python -m pytest scripts/tests/test_neuroinclusive_prompt_contract.py -q

      - name: Verify security guardrails
        run: python scripts/audit_security_guardrails.py --target scripts
