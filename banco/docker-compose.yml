version: '3.8'

services:
  squad-db:
    build:
      context: ..
      dockerfile: banco/Dockerfile
    container_name: agents_squad_db
    restart: unless-stopped
    volumes:
      - ./banco:/app/banco
      - ../scripts:/app/scripts
      - ../work:/app/work
    environment:
      - PYTHONUNBUFFERED=1
      - SQUAD_DB_PATH=/app/banco/squad.db
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; conn = sqlite3.connect('/app/banco/squad.db'); conn.execute('SELECT 1'); conn.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  graph-memory:
    image: falkordb/falkordb:latest
    container_name: agents_squad_graph
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - graph_data:/data

  mcp-bridge:
    build:
      context: ..
      dockerfile: banco/Dockerfile
    container_name: agents_squad_mcp_bridge
    restart: unless-stopped
    depends_on:
      - squad-db
      - graph-memory
    command: ["python", "scripts/sync_mcp_servers.py"]
    volumes:
      - ../config:/app/config
      - ../banco:/app/banco
      - ../scripts:/app/scripts

volumes:
  graph_data:
    driver: local
