[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-squad"
version = "1.0.0"
description = "Agents Squad Local Control Plane & SDLC Swarm"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
    "pydantic>=2.7.0",
    "pydantic-core>=2.18.0",
    "requests>=2.31.0",
    "anyio>=4.0.0",
    "cryptography>=50.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tenacity>=8.2.3",
    "duckdb>=1.0.0",
    "jsonschema>=4.20.0",
    "packaging>=23.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.30.0",
    "json5>=0.9.0",
    "tomlkit>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-bdd>=7.1.0",
]
adapters = [
    "json5>=0.9.0",
    "tomlkit>=0.11.0",
]

[project.scripts]
squad = "scripts.agent_squad:main"
agent-squad = "scripts.agent_squad:main"

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
markers = [
  "AC_QUALITY_1: critério BDD para rejeição de alegações sem evidência",
  "AC_QUALITY_2: critério BDD para ciclo TDD completo",
]

[tool.coverage.run]
source = ["scripts", "integrations"]
branch = true
omit = [
  "scripts/tests/*",
  "integrations/vendor/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 85% is the realistic CI target while the test suite is being stabilized
# (Sprint 2-B D-6). 100% is the long-term goal but currently unreachable
# because several tests fail; raising this to 100% blocks every PR until
# the suite is fully green again.
fail_under = 85
