# Marcador por projeto: qual organização/projeto Azure DevOps este PROJECT_ROOT usa.
# Copie para <project_root>/.agents_squad/config/devops.yaml e ajuste os valores —
# nenhum destes valores fica hardcoded em código compartilhado do squad.
#
# Exemplo de referência usado durante o desenho deste template: org "cbvgas",
# projeto "Arthemis" (https://cbvgas.visualstudio.com/Arthemis). Troque livremente.
provider: azure-devops
org_url: https://cbvgas.visualstudio.com   # ou https://dev.azure.com/<org>
project: Arthemis
repo: Arthemis                              # nome do repositório Azure Repos alvo das PRs
process_template: agile                     # agile | scrum | basic | cmmi — confirme em Project Settings > Process

# Tradução dos tipos internos do squad para os tipos de work item do processo escolhido.
# Os nomes abaixo são os do template "Agile"; ajuste se o projeto usar Scrum/CMMI/Basic:
#   Scrum: story -> "Product Backlog Item"
#   CMMI:  story -> Requirement, epic -> Epic, task -> Task, bug -> Bug
#   Basic: epic -> Epic, story -> Issue, task -> Task
work_item_type_map:
  epic: Epic
  story: "User Story"
  task: Task
  bug: Bug
  spike: Task
  release: Task
  evolution: Epic
  study: Task

# Tradução dos estados do ciclo do squad (config/workflow.yaml) para estados do Board.
# US-10 (2026-09-02): removido `review-qa` — estado órfão, não usado em cycles.yaml.
# Nota: o Azure Boards Agile process tem 4 estados nativos (New/Active/Resolved/Closed).
# Para separar scaffolding/implementation/code-security-review em colunas distintas,
# crie colunas customizadas no board (Board > Column options > Add column) ou use
# um processo customizado. O state_map abaixo mapeia para os estados padrão;
# as tags phase-* permitem filtrar por fase dentro de cada coluna.
state_map:
  blueprint: New
  scaffolding: Active
  implementation: Active
  code-security-review: Active
  quality-validation: Resolved
  governance-release: Resolved
  done: Closed

  # Opcional: se o projeto tiver colunas customizadas, descomente e ajuste:
  # scaffolding: "In Progress"
  # implementation: "Implementation"
  # code-security-review: "Review"

# Phase tags (US-1, 2026-09-02): aplicadas pelo connector ao mover estado,
# refletem a fase real do work item sem custom states herdados. Usadas em
# swimlanes do board Stories e em queries OData do Analytics.
phase_tags:
  blueprint: phase-blueprint
  scaffolding: phase-scaffolding
  implementation: phase-implementation
  code-security-review: phase-code-security-review
  quality-validation: phase-quality-validation
  governance-release: phase-governance-release
  done: phase-done

# Squad tags (US-1, 2026-09-02): discriminam squad temática nos swimlanes.
# Aplicadas pelo squad-owner persona ao atribuir o work item.
squad_tags:
  core: squad-core
  web: squad-web
  mobile: squad-mobile
  data: squad-data
  ai: squad-ai
  infra-cloud: squad-infra-cloud
  quality: squad-quality

area_path: Arthemis
iteration_path: Arthemis

# Contas Azure DevOps (não são personas). Os 41 agentes compartilham estas 3 contas.
