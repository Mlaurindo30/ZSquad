  pr_and_card_approver:
    email: arthemis@michellaurindooutlook812.onmicrosoft.com
    role: required-reviewer
    notifications: true
    # Ordem reflete: default voter, security paths, qa paths, perf paths,
    # cyber paths, governance (card close no G6). SoD preservada.
    used_by:
      - code-reviewer              # default em todos os PRs (G4 owner)
      - security-reviewer          # obrigatório em paths sensíveis (G4 collab)
      - qa-engineer                # obrigatório em paths de teste/aceitação (G5 owner)
      - performance-engineer       # obrigatório em paths de perf/hotpath (G5 collab)
      - governance-auditor         # fecha/move card no G6 (NÃO vota PR)

# US-ACCT-01 (2026-09-02): contas de serviço especializadas. Não são personas,
# nem aprovadores de PR. Permissões restritas e segregadas por projeto.
# Mantêm a SoD de 3 contas principais (squads@ / arthemis@ / human_master).
service_accounts:
  cyber_red:
    email: cyber-red@michellaurindooutlook812.onmicrosoft.com
    purpose: "Operações de Red Team / Offensive Cyber. Conta dedicada para 34-offensive-cyber-operator (duplo sign-off com 10-security-reviewer em auth/crypto/iac)."
    role: security-service
    permissions: [Project Contributors, Security Service]
    scope_paths: [auth/, crypto/, iac/*.tf, Dockerfile]
    used_by: [offensive-cyber-operator]
    double_signoff_with: [security-reviewer]
    notifications: true
  customer_data_pii:
    email: customer_data_pii@michellaurindooutlook812.onmicrosoft.com
    purpose: "Acesso a pipelines e dados PII/sensíveis. Segregação por projeto; sem voto em PR; somente leitura em datasets."
    role: data-reader
    permissions: [Data Reader, Build Service]
    scope_paths: [datasets/pii/, pipelines/data-pii-*]
    used_by: []
    notifications: false
    segregation: "Sem acesso a repositórios de produção; somente datasets e pipelines classificados como PII."

# Quem aprova DENTRO do squad (personas) vs contas Azure DevOps.
approvals:
  pull_request_agent: code-reviewer
  card_agent: governance-auditor
  security_collaborator: security-reviewer
  human_gates:
    - G1-product
    - G6-governance-release

pr_policy:
  minimum_reviewers: 1
  require_linked_work_item: true
  target_branch: main
  creator_vote_counts: false
  reset_on_source_push: true
  block_last_pusher: true

scoring:
  story_points:
    field: Microsoft.VSTS.Scheduling.StoryPoints
    allowed: [1, 2, 3, 5, 8]
    max: 8
    split_rule: mandatory
  epic_tshirt:
    field: Microsoft.VSTS.Scheduling.Effort
    map:
      PP: 1
      P: 2
      M: 3
      G: 5
      GG: 8

colors:
  work_item_types:
    Epic: "#E06C00"
    Feature: "#773B93"
    "User Story": "#0098C7"
    Task: "#A4880A"
    Bug: "#CC293D"
  tags:
    risk-low: "#107C10"
    risk-medium: "#FFB900"
    risk-high: "#D13438"
    risk-critical: "#5C2D91"
    gate-g4: "#5C2D91"
    gate-g6: "#004B50"

board:
  enable_epic_backlog: true
  bugs_behavior: asTasks
  include_area_children: true
  apply_custom_card_rules: false
  # WIP por coluna do board Agile padrão. Se o projeto usar colunas customizadas,
  # edite para bater com os nomes exatos do board (Stories > Column options).
  # Internamente, o squad usa colunas separadas (scaffolding/implementation/code-security-review)
  # compartilhando o estado Active do Azure Boards — para separação visual total,
  # crie colunas customizadas no board ou use swimlanes por tag.
  wip:
    New: 2
    Active: 6
    Resolved: 2
    Closed: 10
  # Swimlanes por squad temática (aplicadas via query-based no board).
  # Cada squad aparece como uma faixa separada no Stories board.
  swimlanes:
    - name: "Squad Core"
      query: "System.Tags CONTAINS 'squad-core'"
    - name: "Squad Web"
      query: "System.Tags CONTAINS 'squad-web'"
    - name: "Squad Mobile"
      query: "System.Tags CONTAINS 'squad-mobile'"
    - name: "Squad Data"
      query: "System.Tags CONTAINS 'squad-data'"
    - name: "Squad AI"
      query: "System.Tags CONTAINS 'squad-ai'"
    - name: "Squad Infra-Cloud"
      query: "System.Tags CONTAINS 'squad-infra-cloud'"
    - name: "Squad Quality"
      query: "System.Tags CONTAINS 'squad-quality'"
    - name: "Without Squad"
      query: "NOT (System.Tags CONTAINS 'squad-')"

# US-2 (2026-09-02): queries salvas em pasta Shared/Agents Squad/.
# Idempotente — reaplicar não duplica. Setar enabled: false para desabilitar.
queries:
  enabled: true
  folder: Shared/Agents Squad

# US-4 (2026-09-02): URL base do Analytics OData para queries CFD/Cycle Time
# por squad temática (filtro System.Tags CONTAINS 'squad-*'). Read-only.
analytics:
  base_url: https://analytics.dev.azure.com/{org}/{project}/_odata/v2.0/

# US-3 (2026-09-02): Delivery Plans (cross-team) — opt-in. Default OFF porque
# cada projeto tem cadência própria; ligar quando múltiplos times forem criados.
delivery_plan:
  enabled: false
  name: "Agents Squad — Delivery Plan"

# US-5 (2026-09-02): Dashboards (1 team + 1 project). Default OFF — contributionIds
# mudam entre versões da Azure DevOps; ligar após validar com primeira execução.
dashboards:
  enabled: false
  items:
    - name: "Agents Squad — Team Overview"
      scope: project_Team
      widgets: []
    - name: "Agents Squad — Project Overview"
      scope: project
      widgets: []

# US-6 (2026-09-02): Project wiki + 5 pages (Home, Architecture, Onboarding,
# Runbooks, Compliance). Default OFF — opt-in via flag quando projeto estiver
# maduro o suficiente para ter docs estáveis.
wiki:
  enabled: false
  pages:
    - { title: "Home", slug: "home" }
    - { title: "Architecture", slug: "architecture" }
    - { title: "Onboarding", slug: "onboarding" }
    - { title: "Runbooks", slug: "runbooks" }
    - { title: "Compliance", slug: "compliance" }

notifications:
  route_to: development_team
  opt_out_human_master: true
  events:
    - ms.vss-work.workitem-changed-event
    - ms.vss-code.pull-request-updated-event
    - ms.vss-build.build-completed-event

areas:
  - Delivery
  - Platform

iterations:
  - name: Iteration 1
    start: "2026-09-01"
    finish: "2026-09-14"
  - name: Iteration 2
    start: "2026-09-15"
    finish: "2026-09-28"
  - name: Iteration 3
    start: "2026-09-29"
    finish: "2026-10-12"

# Times adicionais além do time default do projeto (criado automaticamente na project creation).
# Cada entry gera POST /_apis/projects/{projectId}/teams. Idempotente.
teams:
  - name: "Squad Core"
    description: "Time principal de desenvolvimento — backend, APIs e lógica de domínio."
  - name: "Squad Web"
    description: "Time frontend e UX — React, interfaces e experiência do usuário."
  - name: "Squad AI"
    description: "Time de inteligência artificial — modelos, RAG, agentes e pipelines de dados."

# Security ACLs via accesscontrollists API (opt-in). Default OFF.
# namespaces conhecidos: Project (52d94092-0000-0000-0000-000000000000),
# Git Repositories (83e9ad7f-0000-0000-0000-000000000000),
# WorkItemTracking (c0e7a4c0-0000-0000-0000-000000000000).
security:
  enabled: false
  acls:
    - namespace: "Project"
      namespaceId: "52d94092-0000-0000-0000-000000000000"
      token: ""  # vazio = project-level; preencha com repoId para scoped
      inherit: true
      entries:
        - descriptor: "Microsoft.TeamFoundation.Identity\\c1c73e21-a7c4-4f2c-9b4e-0e7a3d3e3e3e"  # development_team AAD group
          allow: [6]  # GenericRead=1, GenericWrite=2, DeleteTask=4, ManagePermissions=8 — usar soma
          deny: []

# Service Connections para CI/CD, container registries e Kubernetes (opt-in).
service_connections:
  - name: "Azure-ARMTemplate"
    type: "azure_rm"
    service_account: "customer_data_pii"
    scope:
      subscription_id: "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
      subscription_name: "Azure Subscription"
    auth:
      tenant_id: "YYYYYYYY-YYYY-YYYY-YYYY-YYYYYYYYYYYY"
      client_id: "ZZZZZZZZ-ZZZZ-ZZZZ-ZZZZ-ZZZZZZZZZZZZ"
      client_secret: ""  # preencher via Key Vault ou secret; nunca em texto plano
  - name: "GitHub-Arthemis"
    type: "github"
    service_account: "development_team"
    auth:
      token: ""  # GitHub PAT com scope repo:org; nunca em texto plano
  - name: "DockerHub-Public"
    type: "docker_registry"
    service_account: "development_team"
    auth:
      docker_registry: "https://index.docker.io/v1/"
      username: ""  # preencher com usuário real
      password: ""  # preencher via secret; nunca em texto plano
  - name: "AKS-Cluster"
    type: "kubernetes"
    service_account: "customer_data_pii"
    auth:
      kubeconfig: ""  # kubeconfig YAML (base64 encoded); nunca em texto plano
      accept_untrusted_certs: false
