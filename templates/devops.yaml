    role: project-admin
    notifications: false
    used_by: []
  development_team:
    email: squads@michellaurindooutlook812.onmicrosoft.com
    role: contributors
    notifications: true
    used_by:
      - delivery-orchestrator
      - requirements-analyst
      - product-owner
      - scrum-master
      - solution-architect
      - data-ai-architect
      - software-engineer
      - data-engineer
      - mlops-llmops-engineer
      - security-reviewer
      - test-engineer
      - qa-engineer
      - devops-release-engineer
      - ai-analyst
      - dba-databricks-engineer
      - ai-engineer
      - skill-curator
      - technical-writer
      - ux-researcher
      - frontend-engineer
      - backend-engineer
      - data-architect
      - ml-engineer
      - agent-rag-engineer
      - sre-observability-engineer
      - platform-engineer
      - performance-engineer
      - integration-engineer
      - brand-strategist
      - direct-response-copywriter
      - growth-marketing-strategist
      - storytelling-strategist
      - swarm-consensus-coordinator
      - fullstack-engineer
      - mobile-engineer
      - cloud-architect
      - agile-coach
      - ui-designer
